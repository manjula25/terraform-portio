name: terraform plan

# Runs on every PR. The plan comment is the review artifact: for the
# shared model in organization/, it is the blast-radius statement that
# the boundary rules require before any tightening merges.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write # Workload Identity Federation to GCP for the state bucket

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover changed stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.set.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Plan only the stacks a PR actually touches, plus every project
      # stack when modules/ changes — a shared-module edit changes the
      # plan for all of them, and that is exactly what reviewers need
      # to see.
      - id: set
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"

          all_stacks="$(find organization projects -name '*.tf' -exec dirname {} \; | sort -u)"

          if grep -q '^modules/' <<< "$changed"; then
            stacks="$all_stacks"
          else
            stacks="$(grep -E '^(organization|projects/[^/]+)/' <<< "$changed" \
              | cut -d/ -f1-2 \
              | sed 's|^organization/.*|organization|' \
              | sort -u || true)"
          fi

          if [ -z "$stacks" ]; then
            echo 'stacks=[]' >> "$GITHUB_OUTPUT"
          else
            echo "stacks=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$stacks")" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: plan ${{ matrix.stack }}
    needs: discover
    if: needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # Keyless auth. A long-lived GCP service-account JSON key in a
      # repo secret is the thing this avoids.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
        working-directory: .

      - run: terraform init -input=false

      - run: terraform validate

      - id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m \
            -out=tfplan | tee plan.txt
          # Fail the check on a destroy or replace in the shared model.
          # The provider is create-and-override; a silent replace on a
          # blueprint takes its entities with it.
          if [ "${{ matrix.stack }}" = "organization" ] \
             && terraform show -json tfplan \
                | jq -e '.resource_changes[]?.change.actions
                         | index("delete")' > /dev/null; then
            echo "::error::plan destroys or replaces a shared blueprint — needs an explicit platform-team override"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ strategy.job-index }}
          path: ${{ matrix.stack }}/tfplan
          retention-days: 5

      - uses: actions/github-script@v7
        if: always()
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.STACK}/plan.txt`;
            let body = `### \`terraform plan\` — \`${process.env.STACK}\`\n\n`;
            if (fs.existsSync(path)) {
              let out = fs.readFileSync(path, 'utf8');
              const limit = 60000;
              if (out.length > limit) {
                out = out.slice(-limit) + '\n\n[truncated — see the job log for the full plan]';
              }
              body += '```terraform\n' + out + '\n```';
            } else {
              body += '_Plan did not produce output. See the job log._';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
